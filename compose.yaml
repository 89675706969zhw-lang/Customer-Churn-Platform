services:
  retention:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - model-cache:/app/.runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
volumes:
  model-cache:
